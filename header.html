<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Header</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #4b6cb7, #182848);
      color: white;
      font-family: 'Poppins', sans-serif;
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }
    img {
      width: 45px;
      margin-top: 4.5px;
      transition: transform 0.4s ease;
    }
    img:hover {
      transform: scale(1.1) rotate(5deg);
    }
    h1 {
      margin: 10px 0 5px 0;
    }
    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }
  </style>
</head>
<body>
  <h1>🌐 My Website</h1>
  <img src="my-profile-img.jpg">
  <p>Welcome to My Profile</p>
</body>
</html>
